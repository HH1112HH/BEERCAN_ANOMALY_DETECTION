# Copy to config.yaml locally and replace every placeholder.
# Keep actual camera credentials, ESP IPs, and private settings out of Git.
camera:
  rtsp_url: "rtsp://USER:PASSWORD@CAMERA_IP:554/cam/realmonitor?channel=1&subtype=0"
  width: 1280
  height: 720
  fps: 30
  inspect_delay: 1.0

yolo:
  model: "models/weights.pt"
  confidence: 0.97
  iou: 0.45
  device: "cpu"
  half: false
  max_det: 1
  imgsz: 960

patchcore:
  model: "models/patchcore_model.pkl"
  threshold: 0.0873
  device: "cpu"

esp:
  ip: "ESP_HOST_OR_IP"
  protocol: "tcp"
  conveyor_port: 12345
  http_port: 80

server:
  host: "0.0.0.0"
  port: 5004
