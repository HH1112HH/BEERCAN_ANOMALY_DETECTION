# Copy to config.yaml locally and replace every placeholder.
# Keep actual camera credentials, ESP IPs, and private settings out of Git.
camera:
  rtsp_url: "rtsp://USER:PASSWORD@CAMERA_IP:554/cam/realmonitor?channel=1&subtype=0"
  width: 1280
  height: 720
  fps: 30
  inspect_delay: 0.4

yolo:
  model: "models/weights.pt"
  confidence: 0.45
  iou: 0.45
  device: "cuda:0"
  half: true
  max_det: 5
  imgsz: 960

anomaly:
  algorithm: "draem"

draem:
  model: "models/draem.pth"
  threshold: 0.55
  device: "cuda:0"

patchcore:
  model: "models/patchcore_model.pkl"
  threshold: 0.0873
  device: "cuda:0"

esp:
  ip: "ESP_HOST_OR_IP"
  protocol: "tcp"
  conveyor_port: 12345
  http_port: 80

server:
  host: "0.0.0.0"
  port: 5004
